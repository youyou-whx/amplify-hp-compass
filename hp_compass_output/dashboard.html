<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HP Compass Dashboard</title>
  <style>
    :root {
      --bg: #FFF2CC;
      --panel: #fff8e1;
      --text: #3d2b1f;
      --muted: #5c4a3a;
      --line: #cedbe1;
      --model: #1b5e8a;
      --safety: #b8382b;
      --software: #0d7b6b;
      --environment: #8dba94;
      --wetlab: #7e9fc4;
      --implementation: #e08e4a;
      --education: #e4b8b6;
      --wiki: #f5e4c8;
      --problem: #f4d9a8;
      --accent: #f0a659;
      --highlight: #f9ce99;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 14px 28px 10px;
      border-bottom: 1px solid var(--line);
      background: #fff8e1;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .header-logos {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
      background: #ffffff;
      border-radius: 13px;
      padding: 14px 24px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      border: 1px solid #e8dcc8;
    }
    .header-logos img {
      height: 64px;
      width: auto;
    }
    .header-text { flex: 1; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .subtitle { color: var(--muted); max-width: 980px; line-height: 1.55; }
    main { padding: 20px 28px 32px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .metric .value { font-size: 28px; font-weight: 700; color: var(--model); }
    .metric .label { color: var(--muted); margin-top: 4px; }
    .score { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--model); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(360px, 0.75fr);
      gap: 16px;
      align-items: start;
    }
    .panel h2 { margin: 0 0 12px; font-size: 18px; }
    #graph {
      width: 100%;
      min-height: 560px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8e1;
    }
    .cards {
      display: grid;
      gap: 10px;
      max-height: 760px;
      overflow: auto;
      padding-right: 4px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff8e1;
      cursor: pointer;
    }
    .card.active { border-color: #f0a659; box-shadow: 0 0 0 2px rgba(240, 166, 89, 0.18); }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .name { font-weight: 700; line-height: 1.35; }
    /* .score now defined above with color */
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      color: #fff;
      background: #64748b;
    }
    .tag.Model { background: var(--model); color: #fff; }
    .tag.Safety { background: var(--safety); color: #fff; }
    .tag.Software { background: var(--software); color: #fff; }
    .tag.Environment { background: var(--environment); color: #3d2b1f; }
    .tag.Material { background: var(--wetlab); color: #3d2b1f; }
    .tag.WetLab { background: var(--wetlab); color: #3d2b1f; }
    .tag.Implementation { background: var(--implementation); color: #fff; }
    .tag.Education { background: var(--education); color: #3d2b1f; }
    .tag.SocialMedia { background: var(--wiki); color: #3d2b1f; }
    .tag.WikiNarrative { background: var(--wiki); color: #3d2b1f; }
    .tag.ProblemDefinition { background: var(--problem); color: #3d2b1f; }
    .detail {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .timeline {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }
    .timeline-item {
      background: #fff8e1;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .small { font-size: 13px; color: var(--muted); line-height: 1.45; }
    svg text { font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
    @media (max-width: 980px) {
      .metrics, .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-logos">
      <img src="amplify_logo.png" alt="AMPlify" title="AMPlify Team">
      <img src="igem_logo.png" alt="iGEM" title="iGEM 2026">
    </div>
    <div class="header-text">
      <h1>HP Compass Dashboard</h1>
      <div class="subtitle">
        Automated classification, L0-L4 loop status, priority scoring, next-step recommendation,

      </div>
    </div>
  </header>
  <main>
    <section class="metrics" id="metrics"></section>

      <div class="panel">
        <h2>Ranked HP Loops</h2>
        <div class="cards" id="cards"></div>
      </div>
    </section>
    <section class="panel" style="margin-top:16px;">
      <h2>Timeline</h2>
      <div class="timeline" id="timeline"></div>
    </section>

 key concerns?", "Are candidate ranking changes easy to interpret? Is there any risk of misinterpretation?", "Does the risk language avoid overclaiming?", "Which future validations should be flagged as priority?", "Is the current evidence chain sufficient to support candidate screening, rather than clinical efficacy claims?", "What are the most easily overlooked use limitations in this application scenario?"]}, {"hp_id": "HP_20260315_赵天意老师访谈_HP技术小循环_主线优化版_JU_Krakow风", "source_file": "hp record\\20260315_赵天意老师访谈_HP技术小循环_主线优化版_JU_Krakow风格_中文版.docx", "date": "2026-03-15", "stakeholder": "赵天意老师", "stakeholder_type": "AI / 生物大数据专家", "initial_question": "应被认为是抗菌肽、为什么值得合成、失败风险如何降低，以及湿实验如何承接模型判断。\n赵天意老师的反馈非常直接：项目核心方向可以成立，但必须补上判别器、训练策略、数据清洗、结构/膜验证和实验验证这几块证据。正是这些质询，把 AMPlify 从“生成一些候选序列”推进为现在的 TAM-Flow 框架：以 ESM-2 + LoRA 作为编码基础，以 DiT-Rectified Flow 生成候选 latent，以 Oracle 专家模型和 RAFT 奖励过滤降低无效候选比例，再通过理化性质、MD 和湿实验验证闭合证据链。\n因此，这不是一次普通的背景访谈，而是 AMPlify 早期最关键的技术校准之一。它帮助我们把后续干实验和湿实验组织成同一条故事线：模型负责提出可被解释和排序的候选，实验负责检验这些候选是否真正具有抗菌活性和可接受的安全窗口。\nHuman Practices 摘要卡片\nFrom a generic generator to an evidence-bounded AMP design model\n我们联系了谁：赵天意老师，生物大数据相关方向教师。访谈发生在 AMPlify 早期模型设计阶段，主题集中在生成式抗菌肽模…", "feedback": "非常直接：项目核心方向可以成立，但必须补上判别器、训练策略、数据清洗、结构/膜验证和实验验证这几块证据。正是这些质询，把 AMPlify 从“生成一些候选序列”推进为现在的 TAM-Flow 框架：以 ESM-2 + LoRA 作为编码基础，以 DiT-Rectified Flow 生成候选 latent，以 Oracle 专家模型和 RAFT 奖励过滤降低无效候选比例，再通过理化性质、MD 和湿实验验证闭合证据链。\n因此，这不是一次普通的背景访谈，而是 AMPlify 早期最关键的技术校准之一。它帮助我们把后续干实验和湿实验组织成同一条故事线：模型负责提出可被解释和排序的候选，实验负责检验这些候选是否真正具有抗菌活性和可接受的安全窗口。\nHuman Practices 摘要卡片\nFrom a generic generator to an evidence-bounded AMP design model\n我们联系了谁：赵天意老师，生物大数据相关方向教师。访谈发生在 AMPlify 早期模型设计阶段，主题集中在生成式抗菌肽模型、判别器、训练数据和后续验证链。\n为什么：当时我们已经能基于 ESM-2 生成候选肽，并计划合成少量序列，但仍需要确认：这些序列是否真的具有抗菌靶向性，模型是否被数据噪声误导，有限经费下如何提高命中率。\n我们学到了什么：赵老师指出，只有生成器是不够的。项目必须建立能判断抗菌潜力、毒性和关键性质的判别器；不能把大量无关蛋白序列直接混入抗菌肽微调；少量合成候选面临很高失败风险；结构和膜相互作用分析应作为筛选依据。", "project_action": "我们将早期 ESM-2 微调思路发展为 TAM-Flow：ESM-2 + LoRA 编码、DiT-Rectified Flow 生成、Oracle 专家模型评分和 RAFT 奖励过滤；同时加入理化性质、MD、合成质谱、MIC、溶血、CCK-8 和 TEM，形成从预测到实测的证据链。", "evidence": ["MIC", "溶血", "CCK-8", "TEM", "质谱", "细胞毒性", "分子动力学", "RMSD", "RMSF", "理化性质", "报告", "TAM-Flow", "Oracle", "RAFT", "访谈记录"], "returned": false, "processing_mode": "rule", "visits": [], "extension_ref": "", "llm_module_values": {}, "llm_maturity_values": {}, "llm_has_action": false, "llm_has_evidence": false, "llm_feedback_summary": "", "llm_action_summary": "", "llm_wiki_en_section": "", "llm_stability": null, "llm_raw_dir": "", "llm_next_step_cn": "", "llm_next_step_en": "", "llm_materials_cn": [], "llm_materials_en": [], "llm_questions_cn": [], "llm_questions_en": [], "categories": [{"category": "Safety", "score": 1.0, "matched_terms": ["安全", "毒性", "风险", "细胞毒性", "溶血"]}, {"category": "Model", "score": 1.0, "matched_terms": ["模型", "AI", "ESM", "LoRA", "Oracle", "RAFT", "判别器", "生成", "筛选", "评分", "TAM-Flow"]}, {"category": "Material", "score": 1.0, "matched_terms": ["湿实验", "MIC", "溶血", "CCK", "CCK-8", "TEM", "细胞毒性", "实验验证", "质谱", "MD", "分子动力学", "RMSD", "RMSF", "理化性质"]}, {"category": "Social Media", "score": 0.333, "matched_terms": ["摘要卡片", "故事"]}, {"category": "Problem Definition", "score": 0.048, "matched_terms": ["从"]}], "affected_modules": ["Safety", "Model", "Material", "Social Media", "Problem Definition"], "module_memberships": {"Safety": 1.0, "Model": 1.0, "Implementation": 0.0, "Material": 1.0, "Problem Definition": 0.048, "Environment": 0.0, "Software": 0.004, "Education": 0.004, "Social Media": 0.333}, "loop_status": "L3_Evidenced", "loop_level": 3, "evidence_strength": 0.76, "priority_score": 0.803, "priority_factors": {"loop_gap": 0.25, "cross_module_impact": 0.847, "project_criticality": 0.95, "time_urgency": 0.7, "evidence_weakness": 0.24, "stakeholder_value": 0.85}, "fce_vector": {"b1": 0.0036, "b2": 0.0443, "b3": 0.5328, "b4": 0.4193}, "fce_u1_vector": {"b1_1": 0.0, "b1_2": 0.0, "b1_3": 0.4627, "b1_4": 0.5373}, "fce_u2_vector": {"b2_1": 0.0109, "b2_2": 0.133, "b2_3": 0.6733, "b2_4": 0.1828}, "matur erpretation?", "Does the risk language avoid overclaiming?", "Which future validations should be flagged as priority?", "Is the current evidence chain sufficient to support candidate screening, rather than clinical efficacy claims?", "Does this narrative clearly explain who changed the project and what was changed?"]}, {"hp_id": "HP_20260320_罗自卫老师湿实验访谈_HP小循环_JU_Krakow风格_中文版", "source_file": "hp record\\20260320_罗自卫老师湿实验访谈_HP小循环_JU_Krakow风格_中文版修改.docx", "date": "2026-03-20", "stakeholder": "西北农林科技大学罗自卫老师", "stakeholder_type": "湿实验 / 合成生物学专家", "initial_question": "我们需要确定AI 生成的抗菌肽怎样被湿实验可信地验证，哪些证据足以支持候选肽进入软件报告和 Wiki 叙事。", "feedback": "直接影响 AMPlify 的 Wet Lab、Engineering、Model 和 Software：候选肽不再只是按模型分数排序，而要在报告中显示已测证据、机制支持、毒性边界和生产可行性。它让我们的 HP 主线从“真实需求是什么”继续走向“什么证据可以支撑我们的设计”。\nHuman Practices 摘要卡片\n从 AI 候选序列到可验证的湿实验证据链\n我们联系了谁：\n西北农林科技大学罗自卫老师。\n为什么：\n我们需要确定AI 生成的抗菌肽怎样被湿实验可信地验证，哪些证据足以支持候选肽进入软件报告和 Wiki 叙事。\n我们学到了什么：\n抗菌对象必须和应用场景对应，不能只测试方便获得的菌株；同时应覆盖革兰氏阳性菌和阴性菌，并设置已报道高活性抗菌肽或抗生素作为强对照。\nMIC、溶血、细胞毒性、表达量、纯化结果和产物鉴定需要构成一条完善的湿实验证据链。\n生产体系可以与功能验证并行推进：先用化学合成肽验证活性，再用大肠杆菌、毕赤酵母或枯草芽孢杆菌等底盘探索表达与纯化可行性。", "project_action": "将湿实验路线调整为“模型筛选 -> 化学合成 -> MIC 活性验证 -> 溶血/CCK-8 安全性验证 -> TEM/机制支持 -> 表达与纯化可行性”。\n最终不盲目追求几十条序列，而是从模型输出和候选库中筛选 7 条代表性候选肽进入实验验证，并在报告中解释筛选依据和证据边界。\n在 Software 报告中加入 Evidence Level 和 Production Feasibility 标签，区分实测数据、模型推断、文献支持和未来验证。", "evidence": ["MIC", "溶血", "CCK-8", "TEM", "质谱", "细胞毒性", "MD", "理化性质", "报告", "文献", "Field Score", "Evidence Matrix", "TAM-Flow", "Oracle", "访谈记录"], "returned": false, "processing_mode": "rule", "visits": [], "extension_ref": "", "llm_module_values": {}, "llm_maturity_values": {}, "llm_has_action": false, "llm_has_evidence": false, "llm_feedback_summary": "", "llm_action_summary": "", "llm_wiki_en_section": "", "llm_stability": null, "llm_raw_dir": "", "llm_next_step_cn": "", "llm_next_step_en": "", "llm_materials_cn": [], "llm_materials_en": [], "llm_questions_cn": [], "llm_questions_en": [], "categories": [{"category": "Safety", "score": 1.0, "matched_t  and what was changed?"]}, {"hp_id": "HP_20260419_西安市浮生闲猫咪驿站工作人员调研_HP利益相关者主线_JU_Kr", "source_file": "hp record\\20260419_西安市浮生闲猫咪驿站工作人员调研_HP利益相关者主线_JU_Krakow风格_中文版.docx", "date": "2026-04-19", "stakeholder": "西安市浮生闲猫咪驿站工作人员", "stakeholder_type": "公众教育 stakeholder", "initial_question": "此前宠物医院调研让我们意识到，宠物场景中的耐药压力并不一定像规模化养殖那样集中。但我们仍需要来自一线照护者的视角，理解宠物端真实用药行为是否存在被忽略的风险。", "feedback": "宠物猫并不是频繁使用抗生素的对象，但不当用药、过量用药、反复皮肤病和局部感染仍可能造成治疗困难。实际场景中，问题常常不是“用不用抗生素”这么简单，而是诊断、剂量、联合用药和主人认知共同决定结果。", "project_action": "我们把宠物端写成 AMPlify 主线中的“日常照护与用药认知”层：它帮助我们解释为什么抗菌药物替代方案必须谨慎、可解释，并明确边界；同时也说明项目主要验证场景仍应聚焦更高风险、更可控的动物感染问题。\n故事主线：宠物端的问题为什么仍然重要？\n在最初的项目讨论中，宠物感染似乎是一个很直观的入口：猫狗与人类距离近，主人对治疗效果也敏感。但随着我们访问宠物医院和一线照护者，问题变得更加复杂了。工作人员指出，猫并不是抗生素使用最频繁的动物；病毒感染、皮肤问题和耳部问题往往会先通过护理、消毒、消炎、外用药或联合方案处理。也就是说，宠物端并不能被简单写成“抗生素大量使用”的场景。\n然而，这并不意味着宠物端与 AMPlify 无关。恰恰相反，这一站让我们看到另一种风险：当疾病反复、诊断不清或主人自行用药时，治疗会变得混乱。工作人员提到，皮肤病可能因为反复使用抗菌药物而越来越难处理；耳部局部感染也常常需要根据具体病原体调整方案。对 AMPlify 来说，这说明真实世界中的抗菌方案必须能被解释、被限制，并且不能鼓励非专业人员自行使用。", "evidence": ["访谈记录"], "returned": false, "processing_mode": "rule", "visits": [], "extension_ref": "", "llm_module_values": {}, "llm_maturity_values": {}, "llm_has_action": false, "llm_has_evidence": false, "llm_feedback_summary": "", "llm_action_summary": "", "llm_wiki_en_section": "", "llm_stability": null, "llm_raw_dir": "", "llm_next_step_cn": "", "llm_next_step_en": "", "llm_materials_cn": [], "llm_materials_en": [], "llm_questions_cn": [], "llm_questions_en": [], "categories": [{"category": "Education", "score": 1.0, "matched_terms": ["教育", "公众", "猫咪驿站", "理解"]}, {"category": "Problem Definition", "score": 0.531, "matched_terms": ["场景", "主线"]}, {"category": "Safety", "score": 0.434, "matched_terms": ["风险", "边界"]}, {"category": "Implementation", "score": 0.252, "matched_terms": ["养殖", "宠物医院"]}], "affected_modules": ["Education", "Problem Definition", "Safety", "Implementation"], "module_memberships": {"Safety": 0.434, "Model": 0.0, "Implementation": 0.252, "Material": 0.0, "Problem Definition": 0.531, "Enviro y checklist", "Education material v2", "Public understanding feedback form"], "suggested_questions": ["风险措辞是否避免了过度承诺？", "哪些未来验证应被标注为优先？", "该应用场景下最容易被忽略的使用限制是什么？", "受众是否能区分候选筛选、未来应用和现实治疗？"], "suggested_questions_en": ["Does the risk language avoid overclaiming?", "Which future validations should be flagged as priority?", "What are the most easily overlooked use limitations in this application scenario?", "Can the audience distinguish between candidate screening, future applications, and real-world treatment?"]}, {"hp_id": "HP_20260420_杨陵除张村羊场人员张伟调研_HP利益相关者主线_JU_Krako", "source_file": "hp record\\20260420_杨陵除张村羊场人员张伟调研_HP利益相关者主线_JU_Krakow风格_中文版.docx", "date": "2026-04-20", "stakeholder": "杨陵揉谷镇除张村羊场人员张伟", "stakeholder_type": "养殖端 stakeholder", "initial_question": "我们需要理解：在禁抗、食品安全和规模化管理限制下，养殖端真正需要什么样的抗菌替代方案？", "feedback": "羊场以预防为主。乳房炎频率不高但损失明显，混合感染风险使一线更重视广谱、低损伤、给药便利性和成本可控性。", "project_action": "主线从“设计候选抗菌肽”推进为“候选肽必须面对真实养殖约束”。\n故事主线：为什么羊场是项目转向的关键一站？\n前几轮 HP 帮助 AMPlify 逐步校正问题：宠物端让我们看到日常照护和公众认知的复杂性，实验室访谈让我们意识到候选肽必须有证据链支撑；而羊场调研则把项目带入了一个更清晰的应用背景。这里的感染问题不只关乎一只动物是否治好，还关乎泌乳能力、羊奶检测、停奶期、群体防控和养殖户是否愿意承担新技术风险。\n张伟的反馈让我们认识到，养殖端并不会因为一个技术概念新颖就接受它。一线人员首先关心的是能否真正有效、是否影响羊体健康和羊奶质量、能否降低治疗和人工成本、是否适合群体化管理。他更倾向广谱型抗菌肽，因为羊群可能同时暴露于多种病原，实际养殖中也很难每次先完成专业病原检测再选择特异性产品。", "evidence": ["访谈记录"], "returned": false, "processing_mode": "rule", "visits": [], "extension_ref": "", "llm_module_values": {}, "llm_maturity_values": {}, "llm_has_action": false, "llm_has_evidence": false, "llm_feedback_summary": "", "llm_action_summary": "", "llm_wiki_en_section": "", "llm_stability": null, "llm_raw_dir": "", "llm_next_step_cn": "", "llm_next_step_en": "", "llm_materials_cn": [], "llm_materials_en": [], "llm_questions_cn": [], "llm_questions_en": [], "categories": [{"category": "Implementation", "score": 1.0, "matched_terms": ["养殖", "羊场", "成本", "给药", "应用"]}, {"category": "Problem Definition", "score": 0.531, "matched_terms": ["主线", "从"]}, {"category": "Safety", "score": 0.434, "matched_terms": ["安全", "风险"]}, {"cat tation_integrity": {"0": 0.1667, "1": 0.1667, "2": 0.1667, "3": 0.1667, "4": 0.1667, "5": 0.1667}}, "next_step": "将修改后的材料返回给 武功县诚威奶山羊羊场负责人杜欣愿，完成二轮反馈。", "next_step_en": "Return the revised materials to 武功县诚威奶山羊羊场负责人杜欣愿 for second-round feedback.", "suggested_materials": ["application scenario card", "use-boundary checklist"], "suggested_materials_en": ["Application scenario card", "Use-boundary checklist"], "suggested_questions": ["该应用场景下最容易被忽略的使用限制是什么？"], "suggested_questions_en": ["What are the most easily overlooked use limitations in this application scenario?"]}, {"hp_id": "HP_20260501_下乡采访散养羊村民_HP利益相关者主线_JU_Krakow风格_", "source_file": "hp record\\20260501_下乡采访散养羊村民_HP利益相关者主线_JU_Krakow风格_中文版.docx", "date": "2026-05-01", "stakeholder": "基层执业兽医与散养户", "stakeholder_type": "养殖端 stakeholder", "initial_question": "规模羊场调研后，我们需要确认：在更分散、更依赖经验判断的散养场景中，项目需求是否仍然成立。", "feedback": "散养户重视疫苗、通风和预防；他们认可乳腺炎根源是细菌感染，但对抗菌肽这类“高科技”方案保持审慎。", "project_action": "主线加入“基层可理解性”和“实验验证边界”：不能把抗菌肽说成万能替代品。\n故事主线：为什么散养户让项目更谨慎？\n如果说 4 月 20 日的羊场调研让 AMPlify 看到生产动物场景中的经济压力、给药便利性和食品安全约束，那么 5 月 1 日的散养户访谈则进一步提醒我们：一线基层并不会因为一个技术概念新颖就自然接受它。一线养殖者首先关心的是能不能解决问题、会不会带来风险、是否会影响产奶和羊群健康，以及这个方案与疫苗、抗生素和日常预防之间到底是什么关系。\n当我们介绍抗菌肽时，受访者提出了质疑：如果这类方案真的足够有效，是否意味着疫苗都不需要了？这个问题迫使我们重新审视表达方式。AMPlify 不能把抗菌肽叙述为替代所有防控手段的产品，而应把它放在明确适应场景和实验验证的边界内：它是针对细菌感染问题的候选抗菌策略，不是对所有传染病治疗方案、疫苗或养殖管理的替代。\n同时，访谈也确认了项目靶点的现实基础。受访者认为，母羊乳腺炎的最终根源仍然与细菌感染相关：外界挤压或伤口可能只是入口，真正导致感染的是细菌进入乳腺组织。这一判断支持了 AMPlify 继续围绕抗菌机制构建项目故事，但也要求我们把“机制合理”与“真实有效”区分开来。前者是项目成立的逻辑起点，后者必须由实验和更严格的验证来证明。", "evidence": ["访谈记录"], "returned": false, "processing_mode": "rule", "visits": [], "extension_ref": "", "llm_module_values": {}, "llm_maturity_values": {}, "llm_has_action": false, "llm_has_evidence": false, "llm_feedback_summary": "", "llm_action_summary": "", "llm_wiki_en_section": "", "llm_stability": null, "llm_raw_dir": "", "llm_next_step_cn": "", "llm_next_step_en": "", "llm_materials_cn": [], "llm_materials_en": [], "llm_questions_cn": [], "llm_questions_en": [], "categories": [{"c 生素使用压力，但其自身的环境降解、生态影响和真实使用成本仍然需要被纳入评估。", "evidence": ["MIC", "溶血", "CCK-8", "TEM", "细胞毒性", "分子动力学", "软件面板", "理化性质", "面板", "报告", "草图", "PDES", "Environmental Degradation Panel", "访谈记录"], "returned": false, "processing_mode": "rule", "visits": [], "extension_ref": "", "llm_module_values": {}, "llm_maturity_values": {}, "llm_has_action": false, "llm_has_evidence": false, "llm_feedback_summary": "", "llm_action_summary": "", "llm_wiki_en_section": "", "llm_stability": null, "llm_raw_dir": "", "llm_next_step_cn": "", "llm_next_step_en": "", "llm_materials_cn": [], "llm_materials_en": [], "llm_questions_cn": [], "llm_questions_en": [], "categories": [{"category": "Safety", "score": 1.0, "matched_terms": ["安全", "毒性", "风险", "边界", "残留", "低毒", "细胞毒性", "溶血"]}, {"category": "Material", "score": 1.0, "matched_terms": ["MIC", "溶血", "CCK", "CCK-8", "TEM", "细胞毒性", "分子动力学", "理化性质"]}, {"category": "Environment", "score": 1.0, "matched_terms": ["环境", "ARG", "抗性基因", "粪污", "废水", "土壤", "水体", "降解", "持留", "残留", "选择压力", "One Health"]}, {"category": "Software", "score": 1.0, "matched_terms": ["软件", "报告", "面板", "Panel"]}, {"category": "Model", "score": 0.887, "matched_terms": ["模型", "筛选", "PDES"]}], "affected_modules": ["Safety", "Material", "Environment", "Software", "Model"], "module_memberships": {"Safety": 1.0, "Model": 0.887, "Implementation": 0.252, "Material": 1.0, "Problem Definition": 0.531, "Environment": 1.0, "Software": 1.0, "Education": 0.0, "Social Media": 0.0}, "loop_status": "L3_Evidenced", "loop_level": 3, "evidence_strength": 0.746, "priority_score": 0.863, "priority_factors": {"loop_gap": 0.25, "cross_module_impact": 1.0, "project_criticality": 0.95, "time_urgency": 0.7, "evidence_weakness": 0.254, "stakeholder_value": 0.95}, "fce_vector": {"b1": 0.0, "b2": 0.0511, "b3": 0.2689, "b4": 0.68}, "fce_u1_vector": {"b1_1": 0.0, "b1_2": 0.0, "b1_3": 0.1321, "b1_4": 0.8679}, "fce_u2_vector": {"b2_1": 0.0, "b2_2": 0.1533, "b2_3": 0.5431, "b2_4": 0.3036}, "maturity_scores": {"design_ e"}, {"source": "theme_fb:实验验证体系", "target": "theme_fb:Wiki与叙事建设", "relation": "related_via_module"}, {"source": "theme_fb:安全与毒性边界", "target": "theme_fb:养殖场景定义", "relation": "related_via_module"}, {"source": "theme_fb:安全与毒性边界", "target": "theme_fb:Wiki与叙事建设", "relation": "related_via_module"}, {"source": "theme_fb:养殖场景定义", "target": "theme_fb:Wiki与叙事建设", "relation": "related_via_module"}, {"source": "theme_fb:临床场景定义", "target": "theme_fb:抗生素与耐药性", "relation": "related_via_module"}, {"source": "theme_fb:AI模型与算法", "target": "theme_fb:抗生素与耐药性", "relation": "related_via_module"}, {"source": "theme_fb:实验验证体系", "target": "theme_fb:抗生素与耐药性", "relation": "related_via_module"}, {"source": "theme_fb:安全与毒性边界", "target": "theme_fb:抗生素与耐药性", "relation": "related_via_module"}, {"source": "theme_fb:养殖场景定义", "target": "theme_fb:抗生素与耐药性", "relation": "related_via_module"}]}};
    const cards = [...data.cards].sort((a, b) => b.priority_score - a.priority_score);
    const graph = data.graph;

    function cssClass(label) {
      return String(label).replace(/\s+/g, "");
    }

    function renderMetrics() {
      const returned = data.cards.filter(c => c.loop_level === 4).length;
      const high = data.cards.filter(c => c.priority_score >= 0.65).length;
      const modules = new Set(data.cards.flatMap(c => c.affected_modules));
      const metrics = [
        ["HP Loops", data.cards.length],
        ["L4 Returned", returned],
        ["High Priority", high],
        ["Affected Modules", modules.size],
      ];
      document.getElementById("metrics").innerHTML = metrics.map(([label, value]) => `
        <div class="metric"><div class="value">${value}</div><div class="label">${label}</div></div>
      `).join("");
    }

    function renderCards() {
      const root = document.getElementById("cards");
      root.innerHTML = cards.map((card, index) => `
        <article class="card ${index === 0 ? "active" : ""}" data-id="${card.hp_id}">
          <div class="row">
            <div class="name">${escapeHtml(card.stakeholder)}</div>
            <div class="score">${card.priority_score}</div>
          </div>
          <div class="small">${card.loop_status} · ${card.date || "No date"}</div>
          <div class="tags">
            ${card.affected_modules.map(m => `<span class="tag ${cssClass(m)}">${escapeHtml(m)}</span>`).join("")}
          </div>
          <div class="detail">${escapeHtml(card.next_step)}</div>
        </article>
      `).join("");
      root.querySelectorAll(".card").forEach(el => {
        el.addEventListener("click", () => {
          root.querySelectorAll(".card").forEach(item => item.classList.remove("active"));
          el.classList.add("active");
          highlightCard(el.dataset.id);
        });
      });
    }

    function renderTimeline() {
      const timeline = [...data.cards].sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const statusLabels = {"L0_Recorded":"L0","L1_Interpreted":"L1","L2_Actioned":"L2","L3_Evidenced":"L3","L4_Returned":"L4"};
      const statusColors = {"L0_Recorded":"#cedbe1","L1_Interpreted":"#72b6cd","L2_Actioned":"#f0a659","L3_Evidenced":"#bcddae","L4_Returned":"#79a3d1"};
      document.getElementById("timeline").innerHTML = timeline.map(card => {
        const sc = statusColors[card.loop_status] || "#cedbe1";
        const sl = statusLabels[card.loop_status] || "?";
        const mods = (card.affected_modules || []).slice(0, 4);
        const actionText = escapeHtml((card.project_action || card.feedback || "").substring(0, 200));
        return `
        <div class="timeline-item" style="border-left:4px solid ${sc}; padding-left:16px; position:relative">
          <div style="position:absolute; left:-10px; top:18px; width:16px; height:16px; border-radius:50%; background:${sc}; box-shadow:0 0 8px ${sc}60"></div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">
            <strong>${escapeHtml(card.date || "No date")} · ${escapeHtml(card.stakeholder)}</strong>
            <span style="font-weight:700; color:#79a3d1; font-size:14px">${card.priority_score.toFixed(3)}</span>
          </div>
          <div style="font-size:13px; color:#5c4a3a; line-height:1.5; margin-bottom:6px">${actionText}</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center">
            <span style="display:inline-block;background:${sc};color:#fff;padding:1px 8px;border-radius:8px;font-size:10px;font-weight:600">${sl}</span>
            ${mods.map(m => `<span class="tag ${cssClass(m)}" style="font-size:10px;padding:1px 6px">${escapeHtml(m)}</span>`).join("")}
            <span style="margin-left:auto;font-size:11px;color:#79a3d1">Ev:${card.evidence_strength.toFixed(2)}</span>
          </div>
        </div>`;
      }).join("");
    }

    function renderGraph() {
      const svg = document.getElementById("graph");
      const width = 1000, height = 620;
      const nodes = graph.nodes.map((n, i) => ({...n, x: 120 + (i % 6) * 150, y: 90 + Math.floor(i / 6) * 80}));
      const nodeById = new Map(nodes.map(n => [n.id, n]));
      const edges = graph.edges.filter(e => nodeById.has(e.source) && nodeById.has(e.target));

      // ── 预计算边重要性（用于线宽）──
      for (const edge of edges) {
        const a = nodeById.get(edge.source), b = nodeById.get(edge.target);
        const aImp = a.importance || 0.5, bImp = b.importance || 0.5;
        edge._avgImp = (aImp + bImp) / 2;
      }

      for (let iter = 0; iter < 220; iter++) {
        for (const edge of edges) {
          const a = nodeById.get(edge.source), b = nodeById.get(edge.target);
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          const force = (dist - 130) * 0.006;
          const fx = dx / dist * force, fy = dy / dist * force;
          a.x += fx; a.y += fy; b.x -= fx; b.y -= fy;
        }
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const dist2 = Math.max(100, dx * dx + dy * dy);
            const force = 360 / dist2;
            a.x -= dx * force; a.y -= dy * force;
            b.x += dx * force; b.y += dy * force;
          }
        }
        for (const n of nodes) {
          n.x = Math.max(55, Math.min(width - 55, n.x));
          n.y = Math.max(35, Math.min(height - 35, n.y));
        }
      }

      svg.innerHTML = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cedbe1"></path>
          </marker>
        </defs>
      `;

      // ── 边：线宽随重要性 ──
      for (const edge of edges) {
        const a = nodeById.get(edge.source), b = nodeById.get(edge.target);
        const lw = 0.6 + edge._avgImp * 3.8;  // 0.6–4.4
        const alpha = 0.35 + edge._avgImp * 0.55;
        // 边的颜色根据 relation 变化
        const edgeColors = {raised:"#79a3d1", recorded_in:"#cedbe1", led_to:"#f0a659", affects:"#7aaa8a", supported_by:"#e79c98", requires:"#db6254", related_via_module:"#e08e4a"};
        const ec = edgeColors[edge.relation] || "#cedbe1";
        svg.insertAdjacentHTML("beforeend", `
          <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${ec}" stroke-width="${lw.toFixed(1)}" marker-end="url(#arrow)" opacity="${alpha.toFixed(2)}"></line>
        `);
      }

      // ── 节点：大小 + 颜色深度随 importance ──
      for (const n of nodes) {
        const imp = n.importance || 0.5;
        const baseColor = colorForKind(n.kind, n.label);
        const fadedColor = lightenColor(baseColor, (1 - imp) * 0.55);
        const r = radiusForKind(n.kind, imp);
        // 边框加粗用于高重要性节点
        const sw = 0.8 + imp * 2.4;
        svg.insertAdjacentHTML("beforeend", `
          <g class="node" data-id="${n.id}">
            <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${fadedColor}" opacity="0.92" stroke="#3d2b1f" stroke-width="${sw.toFixed(1)}" stroke-opacity="${(0.2+imp*0.6).toFixed(2)}"></circle>
            <text x="${n.x}" y="${n.y + r + 14}" font-size="${(10+imp*4).toFixed(0)}" text-anchor="middle" fill="#3d2b1f" font-weight="${imp>0.6?'600':'400'}">${escapeHtml(truncate(n.label, 80))}</text>
          </g>
        `);
      }
    }

    function lightenColor(hex, factor) {
      hex = hex.replace('#', '');
      const r = Math.round(parseInt(hex.substring(0,2), 16) + (255 - parseInt(hex.substring(0,2), 16)) * factor);
      const g = Math.round(parseInt(hex.substring(2,4), 16) + (255 - parseInt(hex.substring(2,4), 16)) * factor);
      const b = Math.round(parseInt(hex.substring(4,6), 16) + (255 - parseInt(hex.substring(4,6), 16)) * factor);
      return '#' + [r,g,b].map(v => Math.min(255, v).toString(16).padStart(2,'0')).join('');
    }

    function highlightCard(hpId) {
      const svg = document.getElementById("graph");
      svg.querySelectorAll("circle").forEach(circle => circle.setAttribute("stroke", "none"));
      const group = svg.querySelector(`[data-id="hp:${CSS.escape(hpId)}"]`);
      if (group) {
        const circle = group.querySelector("circle");
        circle.setAttribute("stroke", "#f0a659");
        circle.setAttribute("stroke-width", "5");
      }
    }

    function colorForKind(kind, label) {
      // 图谱中所有 Module 节点统一着色
      if (kind === "Module") return "#b8382b";
      return {
        HP: "#3d2b1f",
        Stakeholder: "#79a3d1",
        Feedback: "#72b6cd",
        Action: "#f0a659",
        Evidence: "#e79c98",
        NextStep: "#db6254",
      }[kind] || "#cedbe1";
    }

    function radiusForKind(kind, imp) {
      imp = imp || 0.5;
      const ranges = {
        HP: [12, 31], Stakeholder: [13, 34], Feedback: [9, 20],
        Module: [9, 25], Action: [9, 18], Evidence: [6, 11], NextStep: [7, 11]
      };
      const rng = ranges[kind] || [8, 18];
      return rng[0] + imp * (rng[1] - rng[0]);
    }

    function truncate(value, max) {
      value = String(value || "");
      return value.length <= max ? value : value.slice(0, max - 1) + "…";
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }

    renderMetrics();
    renderCards();
    renderTimeline();
    renderGraph();
  </script>
